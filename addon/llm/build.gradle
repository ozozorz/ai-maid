plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "ai-maid-llm" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    runs {
        client {
            programArg '--username'
            programArg 'MaidDev'
            programArg '--uuid'
            programArg '11111111-1111-1111-1111-111111111111'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    def aiMaid = "io.github.ozozorz.aimaid:ai-maid:${project.aimaid_version}"
    implementation aiMaid
    // Core 的客户端类在完整 JAR 中，组合构建也使用相同的内容。
    clientImplementation(aiMaid) {
        attributes {
            attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR))
        }
    }
}

test { useJUnitPlatform() }

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'ai-maid-llm-tests'
        enableGameTests = true
        enableClientGameTests = true
        eula = true
    }
}
sourceSets.gametest.java.srcDir('../../dev/testsupport/java')
sourceSets.gametest.resources.srcDir('../../dev/testsupport/resources')

processResources {
    def properties = [version: project.version, aimaid_version: project.aimaid_version]
    inputs.properties(properties)
    filesMatching('fabric.mod.json') {
        expand properties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.name}" }
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            from components.java
        }
    }
}
