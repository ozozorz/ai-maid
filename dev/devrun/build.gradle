plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"aimaid-devrun" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		client {
			programArg "--username"
			programArg "MaidDev"

			programArg "--uuid"
			programArg "11111111-1111-1111-1111-111111111111"
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    ['ai-maid', 'ai-maid-lumber', 'ai-maid-farming', 'ai-maid-feeding', 'ai-maid-hauling'].each { name ->
        def coordinate = "io.github.ozozorz.aimaid:${name}:${project.aimaid_version}"
        implementation coordinate
        clientImplementation(coordinate) {
            attributes { attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR)) }
        }
    }

}


tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'ai-maid-integration-tests'
        enableGameTests = true
        enableClientGameTests = true
        eula = true
    }
}

sourceSets.gametest.java.srcDir('../testsupport/java')
sourceSets.gametest.resources.srcDir('../testsupport/resources')
