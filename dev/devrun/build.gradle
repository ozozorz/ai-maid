plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"aimaid-devrun" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		client {
			programArg "--username"
			programArg "MaidDev"

			programArg "--uuid"
			programArg "11111111-1111-1111-1111-111111111111"
		}
	}
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    def modCoordinates = ['ai-maid-lumber', 'ai-maid-farming', 'ai-maid-feeding', 'ai-maid-hauling'].collect { name ->
        "io.github.ozozorz.aimaid:${name}:${name == 'ai-maid-farming' ? project.farming_version : name == 'ai-maid-lumber' ? project.lumber_version : project.aimaid_version}"
    }
    modCoordinates.add("io.github.ozozorz.aimaid:ai-maid:${project.core_version}")
    modCoordinates.add("io.github.ozozorz.aimaid:ai-maid-llm:${project.llm_version}")
    modCoordinates.each { coordinate ->
        implementation coordinate
        clientImplementation(coordinate) {
            attributes { attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR)) }
        }
    }

}


tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'ai-maid-integration-tests'
        enableGameTests = true
        enableClientGameTests = true
        eula = true
    }
}

sourceSets.gametest.java.srcDir('../testsupport/java')
sourceSets.gametest.resources.srcDir('../testsupport/resources')

test { useJUnitPlatform() }

// Fingerprint executable sources, prompts, fixtures and build configuration; never local secrets.
def experimentSources = fileTree('../..') {
    include 'src/**', 'addon/*/src/**', 'dev/devrun/src/**', 'dev/devrun/build.gradle', 'dev/experiments/*.py'
    include 'build.gradle', 'settings.gradle', 'gradle.properties', 'addon/*/build.gradle', 'addon/*/gradle.properties'
}
def experimentBuild = tasks.register('experimentBuild') {
    inputs.files(experimentSources)
    outputs.file(layout.buildDirectory.file('generated/experiment/experiment-build.json'))
    doLast {
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        def root = file('../..').toPath()
        experimentSources.files.sort { root.relativize(it.toPath()).toString() }.each { f ->
            digest.update(root.relativize(f.toPath()).toString().replace('\\','/').getBytes('UTF-8'))
            digest.update((byte) 0)
            digest.update(f.bytes)
        }
        def out = layout.buildDirectory.file('generated/experiment/experiment-build.json').get().asFile
        out.parentFile.mkdirs()
        out.text = groovy.json.JsonOutput.toJson([source_sha256: digest.digest().encodeHex().toString(), file_count: experimentSources.files.size()])
    }
}
processResources {
    dependsOn experimentBuild
    from(layout.buildDirectory.dir('generated/experiment'))
}

// Optional selection avoids re-running unrelated UI tests during harness development.
tasks.named('processGametestResources') {
    def selected = providers.gradleProperty('clientGameTest').orElse('')
    inputs.property('clientGameTest', selected)
    doLast {
        if (!selected.get().isEmpty()) {
            def mod = new File(destinationDir, 'fabric.mod.json')
            def json = new groovy.json.JsonSlurper().parse(mod)
            def names = selected.get().split(',').toList()
            if (!json.entrypoints['fabric-client-gametest'].containsAll(names)) throw new GradleException('Unknown clientGameTest entrypoint')
            json.entrypoints['fabric-client-gametest'] = names
            mod.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json))
        }
    }
}

tasks.named('runClientGameTest') {
    systemProperty 'aimaid.experiment.testCases', providers.gradleProperty('experimentTestCases').orElse('').get()
    systemProperty 'aimaid.experiment.realPilotConfig', providers.gradleProperty('realPilotConfig').orElse('').get()
    systemProperty 'aimaid.experiment.realPilotOutput', providers.gradleProperty('realPilotOutput').orElse('').get()
    systemProperty 'aimaid.experiment.pilotDiagnosticOutput', providers.gradleProperty('pilotDiagnosticOutput').orElse('').get()
}
