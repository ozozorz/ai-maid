pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

// Should match your modid
rootProject.name = 'aimaid-devrun'

// Core
includeBuild('../..') {
    dependencySubstitution {
        substitute module(
                'io.github.ozozorz.aimaid:ai-maid'
        ) using project(':')
    }
}


includeBuild('../../addon/lumber') {
    dependencySubstitution { substitute module('io.github.ozozorz.aimaid:ai-maid-lumber') using project(':') }
}
includeBuild('../../addon/farming') {
    dependencySubstitution { substitute module('io.github.ozozorz.aimaid:ai-maid-farming') using project(':') }
}
includeBuild('../../addon/feeding') {
    dependencySubstitution { substitute module('io.github.ozozorz.aimaid:ai-maid-feeding') using project(':') }
}
includeBuild('../../addon/hauling') {
    dependencySubstitution { substitute module('io.github.ozozorz.aimaid:ai-maid-hauling') using project(':') }
}
includeBuild('../../addon/llm') {
    dependencySubstitution { substitute module('io.github.ozozorz.aimaid:ai-maid-llm') using project(':') }
}
